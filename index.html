<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LOOKSMAX">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>LOOKSMAXXING</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;touch-action:manipulation}
button{user-select:none;-webkit-user-select:none}
html{-webkit-tap-highlight-color:transparent}
body{
  font-family:'Space Grotesk',sans-serif;
  background:#0f172a;color:#e8e8e8;
  min-height:100dvh;max-width:520px;margin:0 auto;overflow-x:hidden;
}
:root{
  --bg:#0f172a;--s1:#141d33;--s2:#1a2440;
  --b1:#243050;--b2:#34405c;
  --t1:#f0f0f0;--t2:#888;--t3:#484848;
  --ac:#c8d0d8;--ac2:#fff;
  --danger:#ff4040;--warn:#ff8800;--green:#3ddc84;--sl:#9580ff;
  --r:8px;--rl:14px;
}

/* HEADER */
#hdr{
  position:sticky;top:0;z-index:100;
  background:#0d1528;border-bottom:1px solid var(--b1);
  padding:0 16px;height:52px;
  display:flex;align-items:center;justify-content:space-between;
}
#hdr-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:26px;letter-spacing:2px;color:var(--ac2);
  display:flex;align-items:center;gap:10px;line-height:1;
}
#wo-dot{
  display:none;width:8px;height:8px;border-radius:50%;
  background:var(--danger);box-shadow:0 0 6px var(--danger);
  animation:blink 1.2s ease-in-out infinite;
}
#wo-dot.on{display:block}
@keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}
#lang-btn{
  background:none;border:1px solid var(--b2);color:var(--t2);
  font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:600;
  letter-spacing:1px;padding:5px 10px;border-radius:20px;cursor:pointer;
  transition:all .15s;min-height:30px;
}
#lang-btn:hover{border-color:var(--ac);color:var(--ac)}
#lang-dd{
  position:absolute;top:52px;right:16px;
  background:var(--s2);border:1px solid var(--b2);
  border-radius:var(--r);z-index:300;display:none;min-width:120px;overflow:hidden;
}
#lang-dd.open{display:block}
.lang-opt{
  padding:10px 16px;font-size:13px;font-weight:600;color:var(--t1);
  cursor:pointer;border-bottom:1px solid var(--b1);transition:background .1s;
}
.lang-opt:last-child{border-bottom:none}
.lang-opt:hover,.lang-opt.on{background:var(--b2);color:var(--ac)}

/* TABS */
#tabs{
  display:flex;border-bottom:1px solid var(--b1);
  background:var(--bg);position:sticky;top:52px;z-index:99;
}
.tb{
  flex:1;background:none;border:none;border-bottom:3px solid transparent;
  color:#666;font-family:'Bebas Neue',sans-serif;font-size:16px;font-weight:700;letter-spacing:1.5px;
  padding:14px 4px 11px;cursor:pointer;transition:all .2s;
}
.tb.on{color:var(--ac2);border-bottom-color:var(--ac2);background:rgba(255,255,255,.04)}
.tb:not(.on):hover{color:#999}
.tb:disabled{color:var(--t3);cursor:not-allowed;opacity:.4}

/* PANES */
.pane{display:none;padding-bottom:80px}
.pane.on{display:block}

/* SECTION */
.sec{padding:20px;border-bottom:1px solid var(--b1)}
.sec-ttl{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:2px;color:#999;margin-bottom:12px}

/* STATS BAR */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--b1);border-bottom:1px solid var(--b1)}
.stat{background:var(--bg);padding:18px 8px;text-align:center}
.stat-v{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--ac2);letter-spacing:1px;line-height:1}
.stat-l{font-size:13px;letter-spacing:1px;color:#888;margin-top:4px}

/* INPUT */
.inp{
  width:100%;background:var(--s1);border:1px solid var(--b2);
  border-radius:var(--r);color:var(--t1);
  font-family:'Space Grotesk',sans-serif;font-size:16px;
  padding:12px 14px;outline:none;transition:border-color .2s;-webkit-appearance:none;
}
.inp:focus{border-color:var(--ac)}
.inp::placeholder{color:var(--t3)}
.ac-wrap{position:relative}
.ac-list{
  position:absolute;top:calc(100% + 4px);left:0;right:0;
  background:var(--s2);border:1px solid var(--b2);border-radius:var(--r);
  z-index:200;max-height:200px;overflow-y:auto;display:none;
}
.ac-list.open{display:block}
.ac-item{
  padding:11px 14px;cursor:pointer;font-size:14px;color:var(--t1);
  border-bottom:1px solid var(--b1);transition:background .1s;
}
.ac-item:last-child{border-bottom:none}
.ac-item:hover{background:var(--b2)}

/* WEIGHT BOX */
#wbox{border:1px solid var(--b2);border-radius:var(--rl);overflow:hidden}
.wdisp{
  display:flex;align-items:center;justify-content:center;
  gap:8px;padding:14px;border-bottom:1px solid var(--b1);background:var(--s1);
}
.wval{
  font-family:'Bebas Neue',sans-serif;font-size:72px;
  color:var(--ac2);letter-spacing:2px;line-height:1;min-width:100px;text-align:center;cursor:pointer;
}
.wunit{font-size:20px;color:var(--t2);font-weight:600;align-self:flex-end;padding-bottom:10px}
/* collapsible preset */
.wpresets{border-bottom:1px solid var(--b1)}
.wpl-toggle{
  width:100%;display:flex;align-items:center;gap:8px;
  background:none;border:none;cursor:pointer;
  padding:10px 12px;min-height:48px;
}
.wpl-toggle-lbl{font-size:12px;letter-spacing:1.5px;color:#888;font-weight:600}
.wpl-cur{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--t2);letter-spacing:1px;margin-left:auto}
.wpl-arrow{font-size:22px;color:var(--t2);display:inline-block;transition:transform .25s;line-height:1}
.wpbtns{display:none;flex-wrap:wrap;gap:5px;padding:0 12px 10px}
.wpb{
  background:var(--s2);border:1px solid var(--b2);color:var(--t2);
  font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:600;
  padding:6px 10px;border-radius:5px;cursor:pointer;transition:all .15s;min-height:32px;
}
.wpb:hover,.wpb.on{background:var(--ac);border-color:var(--ac);color:#000}
.wadj{display:flex;padding:10px;gap:6px}
.ab{
  flex:1;background:var(--s2);border:1px solid var(--b2);border-radius:var(--r);
  font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;
  padding:10px 4px;cursor:pointer;transition:all .12s;min-height:44px;
  display:flex;align-items:center;justify-content:center;
}
.ab.m{color:#ff7070;border-color:#3a1a1a}.ab.m:hover{background:#2a1010}
.ab.p{color:#60e890;border-color:#1a3a25}.ab.p:hover{background:#0e2218}
.ab:active{transform:scale(.94)}

/* REPS/SETS */
.rs-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nc{background:var(--s1);border:1px solid var(--b2);border-radius:var(--r);overflow:hidden}
.nc-l{font-size:13px;font-weight:600;letter-spacing:1.5px;color:#888;text-align:center;padding:10px 0 0}
.nc-row{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 10px;gap:4px}
.ncb{
  width:36px;height:36px;background:var(--s2);border:1px solid var(--b2);
  border-radius:6px;color:var(--t1);font-size:20px;font-weight:300;
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;
}
.ncb:hover{background:var(--b2)}.ncb:active{transform:scale(.9)}
.ncv{font-family:'Bebas Neue',sans-serif;font-size:48px;color:var(--ac2);min-width:50px;text-align:center;line-height:1;cursor:pointer}
.ncu{font-size:13px;color:#777;text-align:center;padding-bottom:4px}

/* REST PRESETS */
.rp-row{display:flex;gap:6px}
.rpb{
  flex:1;background:var(--s1);border:1px solid var(--b2);border-radius:var(--r);
  color:#888;font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;
  padding:9px 4px;cursor:pointer;transition:all .15s;text-align:center;
  min-height:44px;display:flex;align-items:center;justify-content:center;
}
.rpb.on{background:var(--s2);border-color:var(--ac);color:var(--ac)}

/* BUTTONS */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;min-height:52px;border:none;border-radius:var(--r);
  font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;
  cursor:pointer;transition:all .15s;
}
.btn:active{transform:scale(.97)}
.btn-start{
  background:linear-gradient(135deg,#dce4ec,#b8c0c8);color:#000;
  font-size:22px;min-height:62px;border-radius:var(--rl);
}
.btn-start:hover{background:linear-gradient(135deg,#ecf4fc,#c8d0d8)}
.btn-log{
  background:transparent;border:1px solid var(--b2);color:var(--t2);
  font-size:14px;min-height:44px;margin-top:8px;
}
.btn-log:hover{border-color:var(--t2);color:var(--t1)}
.btn-sec{background:var(--s2);border:1px solid var(--b2);color:var(--t1)}
.btn-sec:hover{background:var(--b2)}

/* HISTORY */
.f-row{display:flex;gap:8px}
.fsel{
  flex:1;background:var(--s1);border:1px solid var(--b2);border-radius:var(--r);
  color:var(--t1);font-family:'Space Grotesk',sans-serif;font-size:13px;
  padding:10px 12px;outline:none;-webkit-appearance:none;cursor:pointer;
}
.rc{
  background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);
  padding:14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;
  animation:fi .2s ease;
}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.ri{width:40px;height:40px;background:var(--s2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.rinfo{flex:1;min-width:0}
.rex{font-weight:700;font-size:15px;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rdet{font-size:12px;color:var(--t2);margin-top:2px}
.rmt{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--ac2);letter-spacing:1px;text-align:right;flex-shrink:0}
.rdate{font-size:11px;color:var(--t3);text-align:right}
.empty{text-align:center;color:var(--t3);padding:40px 20px;font-size:14px}
.empty-ic{font-size:40px;margin-bottom:12px;opacity:.4}

/* CHART */
.mbtns{display:flex;gap:6px;margin-top:10px}
.mb{
  flex:1;padding:8px;background:var(--s1);border:1px solid var(--b2);
  border-radius:var(--r);color:var(--t2);font-size:12px;font-weight:600;
  cursor:pointer;transition:all .15s;min-height:38px;letter-spacing:.5px;
}
.mb.on{background:var(--ac2);border-color:var(--ac2);color:#000}
.chart-yl{font-size:10px;color:var(--t3);letter-spacing:1px;margin-bottom:4px}
.chart-wrap{position:relative;height:220px;margin-bottom:4px}

/* WORKOUT OVERLAY */
#wo{
  position:fixed;top:0;bottom:0;
  left:50%;transform:translateX(-50%);
  width:100%;max-width:520px;
  background:var(--bg);z-index:500;
  display:none;flex-direction:column;
}
#wo.on{display:flex}
.woh{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;border-bottom:1px solid var(--b1);flex-shrink:0;
}
.woh-ttl{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;color:var(--t2)}
.woh-ctrls{display:flex;gap:8px}
.woc{
  background:var(--s1);border:1px solid var(--b2);border-radius:6px;
  color:var(--t1);font-size:16px;width:38px;height:38px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;
}
.woc:hover{background:var(--b2)}.woc:disabled{opacity:.3;cursor:default}
.wo-setinfo{
  display:flex;flex-direction:column;align-items:center;
  padding:20px 16px 10px;gap:4px;flex-shrink:0;
}
.wo-setlbl{font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:3px;color:var(--t2)}
.wo-setnum{font-family:'Bebas Neue',sans-serif;font-size:72px;color:var(--ac2);letter-spacing:4px;line-height:1}
.wo-exname{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;color:var(--ac);margin-top:4px}
.wo-winfo{font-size:17px;color:var(--t2);font-weight:600}

/* Phase areas */
.wo-phase{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.wo-phase.on{display:flex}

/* Timer */
.timer-wrap{position:relative;width:200px;height:200px}
.timer-wrap svg{transform:rotate(-90deg)}
#t-bg{fill:none;stroke:var(--s2);stroke-width:8}
#t-arc{
  fill:none;stroke:#4caf50;stroke-width:8;stroke-linecap:round;
  stroke-dasharray:552.92;transition:stroke .3s,stroke-dashoffset 1s linear;
}
#t-arc.warn{stroke:#ff9800}
#t-arc.done{stroke:var(--danger)}
.timer-over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#t-disp{font-family:'Bebas Neue',sans-serif;font-size:54px;letter-spacing:2px;color:#4caf50;line-height:1;transition:color .3s}
#t-disp.warn{color:#ff9800}
#t-disp.done{color:var(--danger)}
.t-rl{font-size:11px;letter-spacing:2px;color:var(--t2);margin-top:4px}

/* Wait phase */
.wo-fire{font-size:80px;display:block;animation:fire-bounce .65s ease-in-out infinite alternate}
@keyframes fire-bounce{from{transform:scale(1) translateY(0)}to{transform:scale(1.12) translateY(-8px)}}
.wo-done-txt{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:3px;color:#fff;text-align:center;margin-top:6px}

/* Completion */
.co-ic{font-size:64px;animation:cpop .4s ease}
@keyframes cpop{0%{transform:scale(0);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
.co-ttl{font-family:'Bebas Neue',sans-serif;font-size:40px;letter-spacing:3px;color:var(--ac2);margin-top:12px}
.co-det{color:var(--t2);font-size:15px;line-height:1.6;margin-top:8px;text-align:center}

/* Action strip */
#wo-action{padding:16px;flex-shrink:0;border-top:1px solid var(--b1)}
.btn-done{background:var(--ac2);color:#000;font-size:24px;min-height:68px;border-radius:var(--rl)}
.btn-done:hover{background:var(--ac)}
.btn-next{background:var(--green);color:#000;font-size:22px;min-height:68px;border-radius:var(--rl)}
.btn-next:hover{background:#50ee94}

/* Screen flash */
#flash{position:fixed;inset:0;background:#fff;z-index:1000;opacity:0;pointer-events:none}

/* DIALOG */
.dlg-ov{
  position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:600;
  display:none;align-items:flex-end;justify-content:center;
}
.dlg-ov.open{display:flex}
.dlg{
  background:var(--s1);border:1px solid var(--b2);
  border-radius:20px 20px 0 0;padding:24px 16px 36px;
  width:100%;max-width:520px;
}
.dlg-ttl{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;color:var(--t1);margin-bottom:6px}
.dlg-body{font-size:14px;color:var(--t2);margin-bottom:20px;line-height:1.5}
.dlg-acts{display:flex;flex-direction:column;gap:8px}
.dbtn{padding:14px;border-radius:var(--r);font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;cursor:pointer;border:none;transition:all .15s;min-height:50px}
.dbtn:active{transform:scale(.97)}
.dbtn-save{background:rgba(200,208,216,.12);color:var(--ac);border:1px solid rgba(200,208,216,.25)}
.dbtn-disc{background:rgba(255,64,64,.12);color:var(--danger);border:1px solid rgba(255,64,64,.25)}
.dbtn-cancel{background:var(--s2);color:var(--t2)}

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px}
</style>
</head>
<body>

<div id="flash"></div>

<!-- HEADER -->
<div id="hdr">
  <div id="hdr-title">
    <div id="wo-dot"></div>
    LOOKSMAXXING
  </div>
  <button id="lang-btn" onclick="toggleLang()">JA ▾</button>
</div>
<div id="lang-dd">
  <div class="lang-opt" data-l="ja" onclick="setLang('ja')">日本語</div>
  <div class="lang-opt" data-l="en" onclick="setLang('en')">English</div>
  <div class="lang-opt" data-l="ko" onclick="setLang('ko')">한국어</div>
  <div class="lang-opt" data-l="zh" onclick="setLang('zh')">中文</div>
  <div class="lang-opt" data-l="es" onclick="setLang('es')">Español</div>
</div>

<!-- TABS -->
<div id="tabs">
  <button class="tb on" id="tb-record" onclick="switchTab('record')" data-i18n="tab_record"></button>
  <button class="tb" id="tb-history" onclick="switchTab('history')" data-i18n="tab_history"></button>
  <button class="tb" id="tb-progress" onclick="switchTab('progress')" data-i18n="tab_progress"></button>
</div>

<!-- RECORD PANE -->
<div id="pane-record" class="pane on">
  <div class="stats">
    <div class="stat"><div class="stat-v" id="st-total">0</div><div class="stat-l" data-i18n="stat_total"></div></div>
    <div class="stat"><div class="stat-v" id="st-week">0</div><div class="stat-l" data-i18n="stat_week"></div></div>
    <div class="stat"><div class="stat-v" id="st-streak">0</div><div class="stat-l" data-i18n="stat_streak"></div></div>
  </div>

  <div class="sec">
    <div class="sec-ttl" data-i18n="sec_exercise"></div>
    <div class="ac-wrap">
      <input type="text" id="ex-inp" class="inp" autocomplete="off"
             oninput="acInput()" onfocus="acFocus()" onblur="acBlur()">
      <div id="ac-list" class="ac-list"></div>
    </div>
  </div>

  <div class="sec">
    <div class="sec-ttl" data-i18n="sec_weight"></div>
    <div id="wbox">
      <div class="wdisp">
        <button class="ncb" style="width:42px;height:42px;font-size:22px" onclick="adjW(-0.5)">−</button>
        <div class="wval" id="wval" onclick="editW()">60</div>
        <span class="wunit">kg</span>
        <button class="ncb" style="width:42px;height:42px;font-size:22px" onclick="adjW(0.5)">+</button>
      </div>
      <div class="wpresets" id="wpresets">
        <button class="wpl-toggle" onclick="togglePresets()">
          <span class="wpl-toggle-lbl">PRESET</span>
          <span class="wpl-cur" id="wpl-cur">60kg</span>
          <span class="wpl-arrow" id="wpl-arrow">▾</span>
        </button>
        <div class="wpbtns" id="wpbtns"></div>
      </div>
      <div class="wadj">
        <button class="ab m" onclick="adjW(-5)">−5</button>
        <button class="ab m" onclick="adjW(-2.5)">−2.5</button>
        <button class="ab m" onclick="adjW(-1)">−1</button>
        <button class="ab p" onclick="adjW(1)">+1</button>
        <button class="ab p" onclick="adjW(2.5)">+2.5</button>
        <button class="ab p" onclick="adjW(5)">+5</button>
      </div>
    </div>
  </div>

  <div class="sec">
    <div class="rs-row">
      <div class="nc">
        <div class="nc-l" data-i18n="lbl_reps"></div>
        <div class="nc-row">
          <button class="ncb" onclick="adjN('r',-1)">−</button>
          <div><div class="ncv" id="rval" onclick="editN('r')">10</div><div class="ncu" data-i18n="u_reps"></div></div>
          <button class="ncb" onclick="adjN('r',1)">+</button>
        </div>
      </div>
      <div class="nc">
        <div class="nc-l" data-i18n="lbl_sets"></div>
        <div class="nc-row">
          <button class="ncb" onclick="adjN('s',-1)">−</button>
          <div><div class="ncv" id="sval" onclick="editN('s')">3</div><div class="ncu" data-i18n="u_sets"></div></div>
          <button class="ncb" onclick="adjN('s',1)">+</button>
        </div>
      </div>
    </div>
  </div>

  <div class="sec">
    <div class="sec-ttl" data-i18n="sec_rest"></div>
    <div class="rp-row" id="rp-row">
      <button class="rpb" data-s="30" onclick="setRest(30)">30s</button>
      <button class="rpb" data-s="60" onclick="setRest(60)">60s</button>
      <button class="rpb on" data-s="90" onclick="setRest(90)">90s</button>
      <button class="rpb" data-s="120" onclick="setRest(120)">2m</button>
      <button class="rpb" data-s="180" onclick="setRest(180)">3m</button>
    </div>
  </div>

  <div class="sec" style="border-bottom:none">
    <button class="btn btn-start" onclick="startWorkout()">
      <span>▶</span><span data-i18n="btn_start"></span>
    </button>

let lang = localStorage.getItem('lang') || 'ja';
function t(k){ return (LANGS[lang]||LANGS.en)[k] || LANGS.en[k] || k; }

function applyLang(){
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.getElementById('ex-inp').placeholder = t('ph_ex');
  document.getElementById('lang-btn').textContent = lang.toUpperCase() + ' ▾';
  document.querySelectorAll('.lang-opt').forEach(el => el.classList.toggle('on', el.dataset.l === lang));
  // Refresh option texts
  document.querySelectorAll('option[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  updateStats();
  renderHistory();
}
function setLang(l){
  lang = l; localStorage.setItem('lang', l);
  document.getElementById('lang-dd').classList.remove('open');
  applyLang();
}
function toggleLang(){ document.getElementById('lang-dd').classList.toggle('open'); }
document.addEventListener('click', e => {
  if(!e.target.closest('#lang-btn') && !e.target.closest('#lang-dd'))
    document.getElementById('lang-dd').classList.remove('open');
});

// ── STORAGE ───────────────────────────────────────────────
const KEY = 'workout_records_v2';
function loadRecs(){ try{ return JSON.parse(localStorage.getItem(KEY)||'[]'); } catch{ return []; } }
function saveRecs(r){ localStorage.setItem(KEY, JSON.stringify(r)); }

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── STATE ─────────────────────────────────────────────────
let curW = 60, curR = 10, curS = 3, curRest = 90, curMetric = 'weight';

// ── WEIGHT CONTROLS ───────────────────────────────────────
const W_PRESETS = [40,50,60,70,80,90,100,110,120,140,160];
function initPresets(){
  document.getElementById('wpbtns').innerHTML = W_PRESETS.map(w =>
    `<button class="wpb${w===curW?' on':''}" onclick="setW(${w})">${w}</button>`
  ).join('');
}
function setW(w){
  curW = Math.max(0, Math.round(w * 2) / 2);
  const v = curW % 1 === 0 ? String(curW) : curW.toFixed(1);
  document.getElementById('wval').textContent = v;
  document.getElementById('wpl-cur').textContent = v + 'kg';
  document.querySelectorAll('.wpb').forEach(b => b.classList.toggle('on', Number(b.textContent) === curW));
}
function adjW(d){ setW(curW + d); }
function togglePresets(){
  const btns = document.getElementById('wpbtns');
  const arrow = document.getElementById('wpl-arrow');
  const open = btns.style.display === 'flex';
  btns.style.display = open ? 'none' : 'flex';
  arrow.style.transform = open ? '' : 'rotate(180deg)';
}

function editW(){
  const el = document.getElementById('wval');
  if(el.querySelector('input')) return;
  el.innerHTML = `<input id="w-inp" type="number" inputmode="decimal" step="0.5" min="0" value="${curW}"
    style="width:130px;background:none;border:none;border-bottom:2px solid var(--ac);
    color:var(--ac2);font-family:'Bebas Neue',sans-serif;font-size:72px;letter-spacing:2px;
    line-height:1;text-align:center;outline:none;-webkit-appearance:none;appearance:none;">`;
  const inp = document.getElementById('w-inp');
  inp.focus(); inp.select();
  let done = false;
  function commit(){
    if(done) return; done = true;
    const v = parseFloat(inp.value);
    if(!isNaN(v) && v >= 0) setW(v);
    else { el.textContent = curW%1===0 ? String(curW) : curW.toFixed(1); }
  }
  inp.addEventListener('blur', commit);
  inp.addEventListener('keydown', e => { if(e.key==='Enter') inp.blur(); });
}

function editN(type){
  const id = type==='r' ? 'rval' : 'sval';
  const el = document.getElementById(id);
  if(el.querySelector('input')) return;
  const cur = type==='r' ? curR : curS;
  el.innerHTML = `<input id="${id}-inp" type="number" inputmode="numeric" min="1" max="${type==='r'?100:20}" value="${cur}"
    style="width:70px;background:none;border:none;border-bottom:2px solid var(--ac);
    color:var(--ac2);font-family:'Bebas Neue',sans-serif;font-size:48px;
    text-align:center;outline:none;-webkit-appearance:none;appearance:none;">`;
  const inp = document.getElementById(`${id}-inp`);
  inp.focus(); inp.select();
  let done = false;
  function commit(){
    if(done) return; done = true;
    const v = parseInt(inp.value, 10);
    if(!isNaN(v) && v >= 1){
      if(type==='r'){ curR = Math.min(100, v); el.textContent = curR; }
      else { curS = Math.min(20, v); el.textContent = curS; }
    } else { el.textContent = cur; }
  }
  inp.addEventListener('blur', commit);
  inp.addEventListener('keydown', e => { if(e.key==='Enter') inp.blur(); });
}

// ── REPS / SETS ───────────────────────────────────────────
function adjN(type, d){
  if(type==='r'){ curR = Math.max(1, Math.min(100, curR+d)); document.getElementById('rval').textContent = curR; }
  else          { curS = Math.max(1, Math.min(20,  curS+d)); document.getElementById('sval').textContent = curS; }
}

// ── REST PRESETS ──────────────────────────────────────────
function setRest(s){
  curRest = s;
  document.querySelectorAll('.rpb').forEach(b => b.classList.toggle('on', Number(b.dataset.s)===s));
}

// ── AUTOCOMPLETE ──────────────────────────────────────────
const JA_EX = ['ベンチプレス','スクワット','デッドリフト','ショルダープレス','ラットプルダウン',
  'ダンベルカール','トライセプスプッシュダウン','レッグプレス','チェストフライ',
  'ベントオーバーロウ','インクラインベンチプレス','レッグカール','カーフレイズ'];
const EN_EX = ['Bench Press','Squat','Deadlift','Shoulder Press','Lat Pulldown',
  'Bicep Curl','Tricep Pushdown','Leg Press','Chest Fly',
  'Bent Over Row','Incline Bench Press','Leg Curl','Calf Raise'];
function exList(){ return (lang==='ja'||lang==='ko'||lang==='zh') ? JA_EX : EN_EX; }

let acT = null;
function acInput(){ clearTimeout(acT); acT = setTimeout(showAC, 60); }
function acFocus(){ showAC(); }
function acBlur(){ setTimeout(()=>document.getElementById('ac-list').classList.remove('open'), 160); }
function showAC(){
  const inp = document.getElementById('ex-inp');
  const list = document.getElementById('ac-list');
  const v = inp.value.trim().toLowerCase();
  const items = v ? exList().filter(p => p.toLowerCase().includes(v)) : exList();
  if(!items.length){ list.classList.remove('open'); return; }
  list.innerHTML = items.map(p =>
    `<div class="ac-item" onmousedown="pickEx('${esc(p)}')">${esc(p)}</div>`
  ).join('');
  list.classList.add('open');
}
function pickEx(n){ document.getElementById('ex-inp').value = n; document.getElementById('ac-list').classList.remove('open'); }

// ── STATS ─────────────────────────────────────────────────
function updateStats(){
  const recs = loadRecs();
  const now = Date.now();
  const wk = recs.filter(r => now - new Date(r.date).getTime() < 7*864e5).length;
  document.getElementById('st-total').textContent = recs.length;
  document.getElementById('st-week').textContent = wk;
  const days = new Set(recs.map(r => r.date.slice(0,10)));
  let streak = 0;
  const d = new Date();
  while(days.has(d.toISOString().slice(0,10))){ streak++; d.setDate(d.getDate()-1); }
  document.getElementById('st-streak').textContent = streak;
}

// ── QUICK LOG ─────────────────────────────────────────────
function quickLog(){
  const ex = document.getElementById('ex-inp').value.trim();
  if(!ex){ document.getElementById('ex-inp').focus(); return; }
  const recs = loadRecs();
  recs.push({
    id:Date.now(), date:new Date().toISOString(),
    exercise:ex, weight:curW, reps:curR, sets:curS,
    volume:curW*curR*curS, est1rm:Math.round(curW*(1+curR/30))
  });
  saveRecs(recs); updateStats(); renderHistory();
  const b = document.querySelector('.btn-log');
  const orig = t('btn_log');
  b.textContent = '✓ SAVED'; b.style.color = 'var(--green)';
  setTimeout(()=>{ b.textContent = orig; b.style.color = ''; }, 1500);
}

// ── WORKOUT STATE ─────────────────────────────────────────
let WS = null;
// { exercise, weight, reps, sets, restSecs, curSet, phase, completedSets[], paused }

function startWorkout(){
  const ex = document.getElementById('ex-inp').value.trim();
  if(!ex){
    const inp = document.getElementById('ex-inp');
    inp.focus(); inp.style.borderColor = 'var(--danger)';
    setTimeout(()=>{ inp.style.borderColor=''; }, 1500);
    return;
  }
  WS = { exercise:ex, weight:curW, reps:curR, sets:curS, restSecs:curRest,
          curSet:1, phase:'active', completedSets:[], paused:false };
  openWo();
  window.addEventListener('beforeunload', onUnload);
}

function openWo(){
  document.getElementById('wo').classList.add('on');
  document.getElementById('wo-dot').classList.add('on');
  document.querySelectorAll('.tb').forEach(b => b.disabled = true);
  refreshWoUI();
}

function closeWo(){
  clearTimer();
  document.getElementById('wo').classList.remove('on');
  document.getElementById('wo-dot').classList.remove('on');
  document.querySelectorAll('.tb').forEach(b => b.disabled = false);
  document.getElementById('reset-btn').style.display = '';
  window.removeEventListener('beforeunload', onUnload);
  WS = null;
  updateStats(); renderHistory();
}

function onUnload(e){ e.preventDefault(); e.returnValue = ''; }

function refreshWoUI(){
  if(!WS) return;
  const {exercise, weight, reps, sets, curSet, phase} = WS;

  document.getElementById('wo-setnum').textContent = `${curSet} / ${sets}`;
  document.getElementById('wo-exname').textContent = exercise;
  document.getElementById('wo-winfo').textContent = `${weight}kg × ${reps}reps`;

  ['ph-active','ph-rest','ph-wait','ph-complete'].forEach(id =>
    document.getElementById(id).classList.remove('on'));

  const doneBtn  = document.getElementById('btn-done');
  const nextBtn  = document.getElementById('btn-next');
  const closeBtn = document.getElementById('btn-close');
  doneBtn.style.display  = 'none';
  nextBtn.style.display  = 'none';
  closeBtn.style.display = 'none';

  const pauseBtn = document.getElementById('pause-btn');
  pauseBtn.disabled = true;

  if(phase === 'active'){
    document.getElementById('ph-active').classList.add('on');
    doneBtn.style.display = '';
    doneBtn.textContent = t('btn_done');
  } else if(phase === 'rest'){
    document.getElementById('ph-rest').classList.add('on');
    pauseBtn.disabled = false;
  } else if(phase === 'wait'){
    document.getElementById('ph-wait').classList.add('on');
    nextBtn.style.display = '';
    nextBtn.textContent = t('btn_next');
  } else if(phase === 'complete'){
    document.getElementById('ph-complete').classList.add('on');
    document.getElementById('co-det').textContent =
      `${exercise}  ${weight}kg × ${reps}reps × ${sets}sets`;
    closeBtn.style.display = '';
    document.getElementById('reset-btn').style.display = 'none';
  }
}

function onDone(){
  if(!WS || WS.phase !== 'active') return;
  WS.completedSets.push({ set:WS.curSet, weight:WS.weight, reps:WS.reps });

  if(WS.curSet >= WS.sets){
    clearTimer();
    saveWoRecord();
    WS.phase = 'complete';
    refreshWoUI();
    setTimeout(closeWo, 3500);
    return;
  }

  WS.phase = 'rest';
  refreshWoUI();
  startTimer();
}

function onNext(){
  if(!WS || WS.phase !== 'wait') return;
  WS.curSet++;
  WS.phase = 'active';
  clearTimer();
  document.getElementById('pause-btn').textContent = '⏸';
  refreshWoUI();
}

// ── TIMER ─────────────────────────────────────────────────
const CIRC = 552.92; // 2π × 88
let timerIv = null, timerRem = 0, timerTotal = 0;

function startTimer(){
  clearTimer(); // 二重起動を防ぐ
  timerTotal = WS.restSecs;
  timerRem = timerTotal;
  WS.paused = false;
  document.getElementById('pause-btn').textContent = '⏸';
  renderTimer();
  timerIv = setInterval(function(){
    if(!WS || WS.paused) return;
    timerRem = Math.max(0, timerRem - 1);
    renderTimer();
    if(timerRem <= 0){
      clearTimer();
      timerDone();
    }
  }, 1000);
}

function clearTimer(){
  if(timerIv !== null){ clearInterval(timerIv); timerIv = null; }
}

function renderTimer(){
  const disp = document.getElementById('t-disp');
  const arc  = document.getElementById('t-arc');
  if(!disp || !arc) return;

  // テキスト更新
  const m = Math.floor(timerRem / 60);
  const s = timerRem % 60;
  disp.textContent = m + ':' + (s < 10 ? '0' : '') + s;

  // SVG 円弧更新（setAttribute で確実に反映）
  const frac = timerTotal > 0 ? timerRem / timerTotal : 0;
  arc.setAttribute('stroke-dashoffset', String(CIRC * (frac - 1)));

  // 色クラス切替（SVG 要素は setAttribute('class') を使う）
  const cls = timerRem <= 0 ? 'done' : timerRem <= 10 ? 'warn' : '';
  disp.className = cls;
  arc.setAttribute('class', cls);
}

function timerDone(){
  playAlarm();
  flashScreen();
  if(WS){ WS.phase = 'wait'; refreshWoUI(); }
  renderTimer();
}

function togglePause(){
  if(!WS || WS.phase !== 'rest') return;
  WS.paused = !WS.paused;
  document.getElementById('pause-btn').textContent = WS.paused ? '▶' : '⏸';
}

// ── ALARM ─────────────────────────────────────────────────
let actx = null;
function getActx(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); return actx; }
function beep(freq, dur, vol){
  try{
    const c = getActx(), o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination);
    o.frequency.value = freq; o.type = 'sine';
    g.gain.setValueAtTime(vol, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
    o.start(c.currentTime); o.stop(c.currentTime + dur);
  } catch(e){}
}
function playAlarm(){
  beep(880, .15, .4);
  setTimeout(()=>beep(880, .15, .4), 220);
  setTimeout(()=>beep(1100, .35, .5), 440);
  if(navigator.vibrate) navigator.vibrate([100,50,100,50,200]);
}
let _fc = 0;
function flashScreen(){
  const el = document.getElementById('flash');
  _fc = 0;
  (function f(){
    el.style.opacity = _fc % 2 === 0 ? '0.55' : '0';
    _fc++;
    if(_fc < 6) setTimeout(f, 110);
    else el.style.opacity = '0';
  })();
}

// ── RESET DIALOG ──────────────────────────────────────────
function showResetDlg(){
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.getElementById('reset-dlg').classList.add('open');
}
function hideResetDlg(){ document.getElementById('reset-dlg').classList.remove('open'); }
function resetAct(act){
  hideResetDlg();
  if(act === 'cancel') return;
  clearTimer();
  if(act === 'save' && WS && WS.completedSets.length > 0) saveWoRecord(true);
  closeWo();
}

// ── SAVE RECORD ───────────────────────────────────────────
function saveWoRecord(partial = false){
  if(!WS) return;
  const setsN = partial ? WS.completedSets.length : WS.sets;
  if(setsN === 0) return;
  const recs = loadRecs();
  recs.push({
    id: Date.now(), date: new Date().toISOString(),
    exercise: WS.exercise, weight: WS.weight, reps: WS.reps, sets: setsN,
    volume: WS.weight * WS.reps * setsN,
    est1rm: Math.round(WS.weight * (1 + WS.reps / 30))
  });
  saveRecs(recs);
}

// ── TABS ──────────────────────────────────────────────────
function switchTab(id){
  document.querySelectorAll('.tb').forEach(b => b.classList.remove('on'));
  document.querySelectorAll('.pane').forEach(p => p.classList.remove('on'));
  document.getElementById(`tb-${id}`).classList.add('on');
  document.getElementById(`pane-${id}`).classList.add('on');
  if(id === 'history') renderHistory();
  if(id === 'progress'){ initPexList(); renderChart(); }
}

// ── HISTORY ───────────────────────────────────────────────
function renderHistory(){
  const recs = loadRecs().slice().reverse();
  const period = document.getElementById('fp').value;
  const exf = document.getElementById('fex').value;
  const now = Date.now();
  const cut = period === 'all' ? null : now - Number(period) * 864e5;
  const filtered = recs.filter(r => {
    if(cut && new Date(r.date).getTime() < cut) return false;
    if(exf !== 'all' && r.exercise !== exf) return false;
    return true;
  });

  const allEx = [...new Set(recs.map(r => r.exercise))];
  const fexEl = document.getElementById('fex');
  const prev = fexEl.value;
  fexEl.innerHTML = `<option value="all">${t('fall_ex')}</option>` +
    allEx.map(e => `<option value="${esc(e)}"${e===prev?' selected':''}>${esc(e)}</option>`).join('');

  const list = document.getElementById('hist-list');
  if(!filtered.length){
    list.innerHTML = `<div class="empty"><div class="empty-ic">🏋️</div>${esc(t('empty'))}</div>`;
    return;
  }
  list.innerHTML = filtered.map(r => `
    <div class="rc">
      <div class="ri">🏋️</div>
      <div class="rinfo">
        <div class="rex">${esc(r.exercise)}</div>
        <div class="rdet">${esc(String(r.weight))}kg × ${esc(String(r.reps))}reps × ${esc(String(r.sets))}sets</div>
      </div>
      <div>
        <div class="rmt">${esc(String(r.weight))}kg</div>
        <div class="rdate">${esc(fmtDate(r.date))}</div>
      </div>
    </div>`).join('');
}

function fmtDate(iso){
  const d = new Date(iso);
  const diff = Math.floor((Date.now() - d.getTime()) / 864e5);
  if(diff === 0) return t('today');
  if(diff === 1) return t('yesterday');
  if(diff < 7) return diff + t('dago');
  return `${d.getMonth()+1}/${d.getDate()}`;
}

// ── CHART ─────────────────────────────────────────────────
let chart = null;
function initPexList(){
  const recs = loadRecs();
  const exs = [...new Set(recs.map(r => r.exercise))];
  const sel = document.getElementById('pex');
  const prev = sel.value;
  sel.innerHTML = `<option value="">${t('sel_ex')}</option>` +
    exs.map(e => `<option value="${esc(e)}"${e===prev?' selected':''}>${esc(e)}</option>`).join('');
}
function setMetric(m){
  curMetric = m;
  ['weight','volume','1rm'].forEach(k =>
    document.getElementById(`mb-${k}`).classList.toggle('on', k===m));
  renderChart();
}
function renderChart(){
  initPexList();
  const ex = document.getElementById('pex').value;
  if(!ex){ if(chart){ chart.destroy(); chart=null; } return; }
  const recs = loadRecs()
    .filter(r => r.exercise === ex)
    .sort((a,b) => new Date(a.date) - new Date(b.date));
  const labels = recs.map(r =>{ const d=new Date(r.date); return `${d.getMonth()+1}/${d.getDate()}`; });
  let data, yl;
  if(curMetric==='weight'){ data=recs.map(r=>r.weight); yl='kg'; }
  else if(curMetric==='volume'){ data=recs.map(r=>r.volume||r.weight*r.reps*r.sets); yl='kg·reps'; }
  else { data=recs.map(r=>r.est1rm||Math.round(r.weight*(1+r.reps/30))); yl='kg (est.1RM)'; }
  document.getElementById('cyl').textContent = yl;
  const ctx = document.getElementById('pchart').getContext('2d');
  if(chart) chart.destroy();
  chart = new Chart(ctx, {
    type:'line',
    data:{ labels, datasets:[{
      data, borderColor:'#c8d0d8', backgroundColor:'rgba(200,208,216,.07)',
      pointBackgroundColor:'#fff', pointRadius:4, pointHoverRadius:6,
      borderWidth:2, tension:.3, fill:true,
    }]},
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false} },
      scales:{
        x:{ ticks:{color:'#555',font:{size:11}}, grid:{color:'rgba(255,255,255,.04)'}, border:{color:'#242424'} },
        y:{ ticks:{color:'#555',font:{size:11}}, grid:{color:'rgba(255,255,255,.04)'}, border:{color:'#242424'} },
      }
    }
  });
}

// ── SERVICE WORKER ────────────────────────────────────────
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});

// ── INIT ──────────────────────────────────────────────────
(function init(){
  initPresets();
  applyLang();
  updateStats();
})();
</script>
